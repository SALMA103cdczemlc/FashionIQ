# Configuration Spark commune (master, workers et driver)

# Cluster
spark.master                        spark://spark-master:7077

# Ressources (adaptées à un poste avec ~8 Go alloués à Docker)
spark.driver.memory                 1g
spark.executor.memory               1g
spark.executor.cores                1
spark.sql.shuffle.partitions        8

# Intégration HDFS
spark.hadoop.fs.defaultFS           hdfs://namenode:9000
# La réplication est décidée par le CLIENT qui écrit : sans cette ligne,
# Spark écrirait avec la valeur Hadoop par défaut (3) au lieu de 2.
spark.hadoop.dfs.replication        2

# Divers
spark.sql.session.timeZone          UTC
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.ui.showConsoleProgress        false
